id: php-mb-strtolower-dotted-i
title: "mb_strtolower(\"yİy\") returns \"yi̇y\" (i + U+0307) since PHP 7.3; 7.2 returned \"yiy\""
language: php
library: stdlib (mbstring)
operation: lower
kind: by-design
letters: ["İ", "i"]
locale_dependent: false
input: "\"yİy\""
expected: "\"yiy\" (hex 796979), as PHP 7.2 returned; this is the Unicode simple lowercase mapping"
actual: "\"yi̇y\" (hex 7969cc8779): PHP 7.3+ follows Unicode SpecialCasing, U+0130 -> 0069 0307"
reproduction:
  command: |
    php -r 'var_dump(bin2hex(mb_strtolower("yİy")), mb_strtolower("yİy") === "yiy");'
    # prints: string(10) "7969cc8779"  bool(false)
  environment: "PHP 8.3.6, Linux"
upstream:
  url: https://bugs.php.net/bug.php?id=78767
  status: by-design
  fix: "Closed \"Not a bug\": PHP 7.3+ applies the full mapping (SpecialCasing, 0130 -> 0069 0307). mb_convert_case($s, MB_CASE_LOWER_SIMPLE) applies the simple mapping and returns \"yiy\". mbstring has no Turkish tailoring; mb_language(\"Turkish\") does not change casing (tested on PHP 8.3.6); the mb_language idea in the bug thread was a suggestion, not a feature."
verification:
  status: verified
  by: "claude-code (AI), reviewed by halilunay"
  date: 2026-10-12
  notes: "Reporter meminaydin, 2019-10-31, PHP 7.3.11. Re-run 2026-10-14: mb_convert_case(\"yİy\", MB_CASE_LOWER_SIMPLE) -> 796979."
references: []

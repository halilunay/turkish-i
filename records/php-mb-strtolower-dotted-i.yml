id: php-mb-strtolower-dotted-i
title: "mb_strtolower(\"yİy\") returns \"yi̇y\" (i + U+0307) since PHP 7.3; 7.2 returned \"yiy\""
language: php
library: stdlib (mbstring)
operation: lower
letters: ["İ", "i"]
locale_dependent: false
input: "\"yİy\""
expected: "\"yiy\" (hex 796979), as PHP 7.2 returned"
actual: "\"yi̇y\" (hex 7969cc8779): PHP 7.3+ follows Unicode SpecialCasing, U+0130 -> 0069 0307"
reproduction:
  command: |
    php -r 'var_dump(bin2hex(mb_strtolower("yİy")), mb_strtolower("yİy") === "yiy");'
    # prints: string(10) "7969cc8779"  bool(false)
  environment: "PHP 8.3.6, Linux"
upstream:
  url: https://bugs.php.net/bug.php?id=78767
  status: by-design
  fix: "Closed \"Not a bug\": the combining dot preserves round-tripping. Turkish rules can be enabled per request via mb_language() per the maintainer's note (not verified here); or strip U+0307 after lowering when only İ/i matters."
verification:
  status: verified
  by: "claude-code (AI), reviewed by halilunay"
  date: 2026-10-12
  notes: "Reporter meminaydin, 2019-10-31, PHP 7.3.11."
references: []
